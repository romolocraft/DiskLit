name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $value = "${{ github.ref_name }}" -replace '^v', ''
          "value=$value" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish DiskLit.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=${{ steps.version.outputs.value }} `
            --output publish
          Move-Item publish/DiskLit.exe DiskLit-win-x64.exe

      - name: Verify single file
        shell: pwsh
        run: |
          $size = [math]::Round((Get-Item DiskLit-win-x64.exe).Length / 1MB, 1)
          Write-Host "DiskLit-win-x64.exe is $size MB"
          $leftovers = Get-ChildItem publish -File -ErrorAction SilentlyContinue
          if ($leftovers) {
            $leftovers | ForEach-Object { Write-Host "unbundled: $($_.Name)" }
            throw "publish left $($leftovers.Count) file(s) outside the single-file bundle"
          }

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash DiskLit-win-x64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  DiskLit-win-x64.exe" | Out-File -FilePath SHA256SUMS.txt -Encoding ascii
          Write-Host "SHA256: $hash"

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash = (Get-FileHash DiskLit-win-x64.exe -Algorithm SHA256).Hash.ToLower()
          $notes = @"
          **Download:** [DiskLit-win-x64.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/DiskLit-win-x64.exe) — one file, no installer, no runtime needed.

          Verify what you downloaded:

          ``````powershell
          Get-FileHash .\DiskLit-win-x64.exe -Algorithm SHA256
          ``````

          ``````
          SHA256  $hash
          ``````

          Built from this tag by GitHub Actions on a clean runner. Read-only analysis, no telemetry, no administrator rights required.
          "@
          $notes | Out-File -FilePath notes.md -Encoding utf8
          gh release create ${{ github.ref_name }} DiskLit-win-x64.exe SHA256SUMS.txt `
            --title ${{ github.ref_name }} `
            --notes-file notes.md
